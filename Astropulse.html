<style>
:root{--bg:#eef2f8;--bg2:#e2e9f3;--panel:#fff;--ink:#0e1829;--mute:#4a596f;--line:#c9d4e3;--acc:#0b6b8c;--accink:#fff;--g:#13774a;--y:#9a5b00;--r:#b42318;--gray:#6b778a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.call{border-left:4px solid var(--acc);background:var(--bg);padding:8px 12px;border-radius:6px;margin:10px 0}

.earth{fill:color-mix(in srgb,var(--acc) 30%,var(--bg2));stroke:var(--acc);stroke-width:2}.lk{fill:none;stroke:var(--acc);stroke-width:3}.lkx{stroke:var(--r);stroke-width:4;stroke-linecap:round}.sc{fill:var(--bg2);stroke:var(--ink);stroke-width:2}.pk{fill:var(--acc)}.lt{font:12px "Atkinson Hyperlegible",sans-serif;fill:var(--mute)}
@media(prefers-reduced-motion:no-preference){.z.s-RED,.z.s-URGENT{animation:pul 1.6s ease-in-out infinite}@keyframes pul{50%{fill-opacity:.2}}.flow{stroke-dasharray:8 10;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-18}}}

</head>
<body>
<div class="app">
<header class="top">
  <div class="grp"><h1>AstroPulse</h1><span class="mute" id="day"></span><span class="mono mute" id="utc"></span></div>
  <div class="grp"><span class="chip" id="pill"></span>
    <label for="mission" class="mute" style="margin:0">Mission setting</label>
    <select id="mission"><option value="spacecraft">Spacecraft</option><option value="station" selected>Space station</option><option value="base">Mars mission (deep space)</option></select></div>
</header>
<nav id="nav" aria-label="Main"></nav>
<main id="main"></main>
</div>
<script>/* AstroPulse rules engine (Step 1)
 * Implements 04_rules. Decision support only, NOT a medical diagnosis.
 * Works in a browser (window.AstroEngine) and in Node (module.exports).
 *
 * Entry fields (leave blank/null if not measured):
 *   date, bpSys, bpDia, hr, glucose, fasting (true/false),
 *   temp, tempUnit ('C' or 'F'), sleep (hours), exercise (minutes), symptoms (array of SYMS keys, [] = none),
 *   phq2 (0-6, optional screen), moodTracker (1-5, never colours anything)
 */
(function (root) {
  'use strict';

  // Higher number = worse. NODATA / CHECK / NOCOLOR never win (GLOBAL-3).
  var RANK = { NODATA: 0, CHECK: 0, NOCOLOR: 0, GREEN: 1, YELLOW: 2, RED: 3, URGENT: 4 };

  // Source names shown with every number (FS-12). [NOT VERIFIED] = check before submission.
  var SOURCES = {
    bp: 'NHLBI; American Heart Association',
    hr: 'MedlinePlus; Cleveland Clinic',
    glucose: 'American Diabetes Association, Standards of Care',
    temp: 'MedlinePlus (NIH/NLM)',
    sleep: 'CDC',
    mood: 'PHQ-2 screening literature (NIH/NIMH-supported)',
    exercise: 'NASA Human Research Program (ISS exercise routine)',
    symptoms: 'NASA Human Research Program risk pages'
  };

  // Default decisions: D-1 mood = tracker + PHQ-2; D-3 latest counts; D-4 below.
  var DEFAULT_OPTIONS = {
    fs4TwoYellows: false,   // optional heuristic
    fs6BpAndHr: false,      // optional heuristic
    fs5Consecutive: 3       // our own number (gap G15)
  };

  function blank(v) {
    return v === null || v === undefined || v === '' || (typeof v === 'number' && isNaN(v));
  }
  function res(status, rule, message, extra) {
    var r = { status: status, rule: rule, message: message, action: null, note: null };
    if (extra) { for (var k in extra) { r[k] = extra[k]; } }
    return r;
  }

  // ---------- Blood pressure (BP-0 .. BP-5) ----------
  function evalBP(e) {
    var S = e.bpSys, D = e.bpDia;
    if (blank(S) || blank(D)) return res('NODATA', 'BP-0', 'Not recorded (both numbers are needed).');
    if (S <= 0 || D <= 0 || S <= D) {
      return res('CHECK', 'BP-0', 'Please re-enter: the top number must be larger than the bottom number.');
    }
    if (S > 180 || D > 120) {
      return res('URGENT', 'BP-1', 'Reading is in the range the source labels a crisis.',
        { action: 'Contact flight surgeon NOW.' });
    }
    if (S >= 140 || D >= 90) {
      return res('RED', 'BP-2', 'At or above the source\'s stage-2 range.',
        { action: 'Re-measure once. If still in this range, contact flight surgeon today.' });
    }
    if ((S >= 130 && S <= 139) || (D >= 80 && D <= 89)) {
      return res('YELLOW', 'BP-3', 'In the source\'s stage-1 range.');
    }
    if (S >= 120 && S <= 129 && D < 80) {
      return res('YELLOW', 'BP-4', 'In the source\'s elevated range.');
    }
    return res('GREEN', 'BP-5', 'Inside the source\'s normal range.',
      { note: 'Note: the source gives no lower limit for normal blood pressure.' });
  }

  // ---------- Heart rate (HR-0 .. HR-3) ----------
  function evalHR(e) {
    var v = e.hr;
    if (blank(v)) return res('NODATA', 'HR-0', 'Not recorded.');
    if (v <= 0) return res('CHECK', 'HR-0', 'Please re-enter this value.');
    if (v >= 60 && v <= 100) return res('GREEN', 'HR-1', 'Inside the typical resting range.');
    var r = res('YELLOW', 'HR-2',
      'Outside the typical resting range; the source says this may need medical evaluation depending on circumstances.',
      { action: 'Re-measure after sitting still for a few minutes, then re-enter.' });
    if (v < 60) r.note = 'If your documented baseline resting rate is normally below 60, mention this when you report.';
    return r; // HR never turns red on its own (gap G2)
  }

  // ---------- Fasting blood sugar (BG-0 .. BG-4) ----------
  function evalGlucose(e) {
    var v = e.glucose;
    if (blank(v)) return res('NODATA', 'BG-0', 'Not recorded.');
    if (v <= 0) return res('CHECK', 'BG-0', 'Please re-enter this value.');
    if (e.fasting === false) {
      return res('NOCOLOR', 'BG-0', 'The given ranges are for fasting readings only. This reading is not scored.');
    }
    if (v >= 126) {
      return res('RED', 'BG-3', 'At or above the source\'s diabetes diagnostic threshold. A threshold, not a diagnosis.',
        { action: 'Re-check fasting, and contact flight surgeon.' });
    }
    if (v >= 100) {
      return res('YELLOW', 'BG-2', 'Above the normal fasting range.',
        { action: 'Re-check fasting on another day.' });
    }
    if (v >= 70) return res('GREEN', 'BG-1', 'Inside the normal fasting range.');
    return res('YELLOW', 'BG-4',
      'Below the given normal range. The provided sources do not define a low-blood-sugar warning level.',
      { note: 'GAP G4: needs a cited source before release.', action: 'Re-check and report it.' });
  }

  // ---------- Temperature (TEMP-0 .. TEMP-4) ----------
  function evalTemp(e) {
    var v = e.temp;
    if (blank(v)) return res('NODATA', 'TEMP-0', 'Not recorded.');
    if (v <= 0) return res('CHECK', 'TEMP-0', 'Please re-enter this value.');
    var f = String(e.tempUnit || 'C').toUpperCase() === 'F';
    var lo = f ? 97.7 : 36.5, hi = f ? 99.1 : 37.3;
    var site = 'Exact thresholds vary by measurement method and body site.';
    if (v >= lo && v <= hi) return res('GREEN', 'TEMP-1', 'Inside the rough healthy adult range.', { note: site });
    if (v > hi) {
      return res('YELLOW', 'TEMP-2', 'Above the given healthy range.',
        { action: 'Re-measure, note the site, and report it.', note: site });
    }
    return res('YELLOW', 'TEMP-3', 'Below the given healthy range.',
      { action: 'Re-measure and report it.', note: site });
  }

  // ---------- Sleep (SLEEP-0 .. SLEEP-3) ----------
  function evalSleep(e) {
    var v = e.sleep;
    if (blank(v)) return res('NODATA', 'SLEEP-0', 'Not recorded.');
    if (v < 0 || v > 24) return res('CHECK', 'SLEEP-0', 'Please re-enter: hours must be between 0 and 24.');
    if (v >= 7) {
      return res('GREEN', 'SLEEP-1', 'Meets the recommended adult duration.',
        { note: 'No upper limit is checked.' });
    }
    return res('YELLOW', 'SLEEP-2', 'Below the recommended adult duration.');
  }

  // ---------- Mood (MOOD-0 .. MOOD-2); PHQ-9 left for a later version ----------
  function evalMood(e) {
    var prompts = [];
    if (!blank(e.moodTracker) && e.moodTracker <= 2) {
      prompts.push('Would you like to do the 2-question mood screen now?');
    }
    var v = e.phq2;
    if (blank(v)) {
      var none = res('NODATA', 'MOOD-0', blank(e.moodTracker)
        ? 'Not recorded.' : 'Daily mood saved. It is a tracker only and does not score a status.');
      none.prompts = prompts;
      return none;
    }
    if (v < 0 || v > 6) return res('CHECK', 'MOOD-0', 'Please re-enter: the screen total is 0 to 6.');
    var r = v >= 3
      ? res('YELLOW', 'MOOD-2', 'Positive screen (cut-off 3). A screen needs further assessment; it is not a diagnosis.',
        { action: 'Raise it with the flight surgeon.' })
      : res('GREEN', 'MOOD-1', 'No positive screen.');
    r.prompts = prompts;
    return r;
  }

  // Symptoms listed on the NASA risk pages (cardiovascular, hypoxia, immune, sensorimotor)
  var SYMS = {
    faint: 'Lightheaded, dizzy or fainting',
    head: 'Headache or confusion',
    vision: 'Vision changes',
    skin: 'Rash, cold sore or signs of infection',
    heart: 'Irregular or racing heartbeat'
  };

  // ---------- Exercise (EX-0 .. EX-2): a NASA plan target, never a health limit ----------
  function evalExercise(e) {
    var v = e.exercise;
    if (blank(v)) return res('NODATA', 'EX-0', 'Not recorded.');
    if (v < 0 || v > 1440) return res('CHECK', 'EX-0', 'Please re-enter: minutes must be between 0 and 1440.');
    if (v >= 90) return res('GREEN', 'EX-1', 'Matches the NASA ISS routine of 1.5 hours of exercise a day.');
    return res('NOCOLOR', 'EX-2', 'Below the 1.5 hour routine. NASA crews exercise 6 to 7 days a week, so one lighter day is normal.',
      { note: 'A plan target from NASA research, not a health limit.' });
  }

  // ---------- Symptoms (SYM-0, SYM-1) ----------
  function evalSymptoms(e) {
    var s = e.symptoms;
    if (!Array.isArray(s)) return res('NODATA', 'SYM-0', 'Not recorded.');
    if (!s.length) return res('GREEN', 'SYM-0', 'No symptoms reported.');
    var names = s.map(function (k) { return SYMS[k] || k; });
    return res('YELLOW', 'SYM-1', 'Reported: ' + names.join('; ') + '. NASA research lists these among spaceflight health risks.',
      { action: 'Report these symptoms to the flight surgeon.' });
  }

  var ORDER = ['bp', 'hr', 'glucose', 'temp', 'sleep', 'mood', 'exercise', 'symptoms'];
  var EVALS = { bp: evalBP, hr: evalHR, glucose: evalGlucose, temp: evalTemp, sleep: evalSleep, mood: evalMood, exercise: evalExercise, symptoms: evalSymptoms };

  // Score one check-in (STEPS 1-3 of file 04)
  function evaluate(entry) {
    var out = { date: entry.date || null, indicators: {}, overall: 'NODATA' };
    var worst = 0;
    ORDER.forEach(function (id) {
      var r = EVALS[id](entry);
      r.id = id;
      r.source = SOURCES[id];
      out.indicators[id] = r;
      if (RANK[r.status] > worst) { worst = RANK[r.status]; out.overall = r.status; }
    });
    if (worst === 0) out.overall = 'NODATA';
    return out;
  }

  function isYellowPlus(r) { return RANK[r.status] >= RANK.YELLOW; }

  // Score a list of check-ins (oldest first) and apply combination rules to the last one.
  function analyze(entries, options) {
    var opt = {};
    for (var k in DEFAULT_OPTIONS) { opt[k] = DEFAULT_OPTIONS[k]; }
    if (options) { for (var k2 in options) { opt[k2] = options[k2]; } }

    var days = entries.map(evaluate);
    var today = days[days.length - 1];
    var raw = entries[entries.length - 1];
    var flags = [];
    function add(rule, level, kind, reason) {
      for (var i = 0; i < flags.length; i++) { if (flags[i].rule === rule) return; } // once per day
      flags.push({ rule: rule, level: level, kind: kind, reason: reason });
    }
    var I = today.indicators;

    // Source-backed escalations (FS-1, FS-2)
    ORDER.forEach(function (id) {
      var r = I[id];
      if (r.status === 'URGENT') {
        add('FS-1', 'immediate', 'sourced', id + ' reading is in an urgent range (rule ' + r.rule + ').');
      } else if (r.status === 'RED') {

      }
    });

    if (I.symptoms.status === 'YELLOW') add('FS-SYM', 'contact', 'heuristic', 'symptoms reported (rule SYM-1) — escalating them is our safety rule');

    // FS-5: same indicator yellow-or-worse on N check-ins in a row
    var n = opt.fs5Consecutive;
    if (n > 0 && days.length >= n) {

        }
        if (all) add('FS-5', 'contact', 'heuristic', id + ' has been outside its range on ' + n + ' check-ins in a row.');
      });
    }

    if (I.temp.status === 'YELLOW' && !blank(raw.hr) && raw.hr > 100) {
      add('FS-7', 'contact', 'heuristic', 'Temperature and heart rate are both outside their given ranges.');
    }

    }

    }

      add('FS-6', 'immediate', 'heuristic', 'Blood pressure is red and heart rate is outside its range.');
    }

    return { days: days, today: today, flags: flags };
  }

  var api = { evaluate: evaluate, analyze: analyze, RANK: RANK, SOURCES: SOURCES, DEFAULT_OPTIONS: DEFAULT_OPTIONS, SYMS: SYMS };

  else { root.AstroEngine = api; }

 const L=k=>e?short(k,e):'–',lab=(x,y,n,v)=>`<text class="lbl" x="${x}" y="${y}"><tspan class="lbn" x="${x}" dy="-14">${n}</tspan><tspan x="${x}" dy="16">${v}</tspan></text>`;
 const svg=`<div class="figwrap"><svg class="fig" viewBox="0 0 430 420" role="group" aria-label="Body map"><g transform="translate(95,0)"><g class="sil ${sel==='body'?'sel':''}" data-r="body"><circle cx="120" cy="46" r="28"/><rect x="108" y="72" width="24" height="16"/><path d="M70 94Q120 82 170 94L180 190Q178 226 160 240L80 240Q62 226 60 190Z"/><path d="M64 98Q40 104 36 140L28 214Q30 224 40 224Q50 222 52 212L66 150Z"/><path d="M176 98Q200 104 204 140L212 214Q210 224 200 224Q190 222 188 212L174 150Z"/><path d="M80 240L119 240L116 340L112 396Q110 408 96 408Q82 408 82 396L86 340Z"/><path d="M160 240L121 240L124 340L128 396Q130 408 144 408Q158 408 158 396L154 340Z"/></g>
 ${z('head','<circle cx="120" cy="46" r="18"/>')}${z('lungs','<ellipse cx="94" cy="120" rx="15" ry="22"/>')}${z('lungs','<ellipse cx="146" cy="120" rx="15" ry="22"/>')}${z('heart','<circle cx="121" cy="134" r="13"/>')}${z('abd','<ellipse cx="120" cy="198" rx="30" ry="22"/>')}${z('limbs','<circle cx="46" cy="150" r="13"/>')}${z('limbs','<circle cx="194" cy="150" r="13"/>')}${z('limbs','<circle cx="100" cy="292" r="14"/>')}${z('limbs','<circle cx="140" cy="292" r="14"/>')}</g>
 <line class="lead" x1="233" y1="46" x2="312" y2="46"/><line class="lead" x1="228" y1="134" x2="312" y2="134"/><line class="lead" x1="245" y1="198" x2="312" y2="198"/><line class="lead" x1="112" y1="262" x2="178" y2="248"/>
 ${lab(318,50,'Sleep',L('sleep')+' h')}${lab(318,138,'Heart rate · BP',L('hr')+' · '+L('bp'))}${lab(318,202,'Blood sugar',L('glucose'))}${lab(8,266,'Temperature',L('temp'))}</svg></div>`;
 const btns=Object.keys(REG).map(k=>{const s=zoneStatus(k,a);return `<button data-r="${k}" aria-pressed="${k===sel}">${s!=='NODATA'?SYM[s]+' ':''}${REG[k].n}</button>`}).join('');
 return `<div class="two"><section class="panel"><h2>Body map</h2><p class="mute">Select a body area. Colors come only from the checked rules. Each area is an educational link, not a scan of that organ.</p>${svg}<div class="regs">${btns}</div><div class="legend"><span class="chip s-GREEN"><b>✓</b> Within range</span> <span class="chip s-YELLOW"><b>!</b> Needs attention</span> <span class="chip s-RED"><b>✕</b> Contact flight surgeon</span> <span class="chip"><b>–</b> Not measured</span></div></section>
 <section class="panel"><h2>${r.n} ${r.ind.length?chip(st):'<span class="chip">Not measured here</span>'}</h2><p>${r.fn}</p>${r.ind.map(k=>`<div class="call"><b>${NAME[k]}:</b> ${e?big(k,e).join(' '):'not recorded'} ${a?chip(a.today.indicators[k].status):''}<br><span class="mute"><b>Why measure this?</b> ${WHY[k]}</span></div>`).join('')}
 <h3 style="margin-top:12px">Hazard lens</h3><p class="mute">NASA’s five hazards of human spaceflight that can affect this area.</p><ul class="l">${r.hz.map(h=>`<li><b>${h[0]}.</b> ${h[1]}</li>`).join('')}</ul><p class="mute">${MIS[$('mission').value]}</p></section></div>`;
}
function vTrends(){
 if(!hist.length)return '<section class="panel"><h2>Trends</h2><p class="mute">Trends appear after your first check-in.</p></section>';
 const S=SERIES();
 return `<section class="panel"><div class="row" style="justify-content:space-between"><h2>Trends</h2><div class="row">${[7,14,30].map(n=>`<button class="btn" data-act="range" data-n="${n}" aria-pressed="${range===n}" ${range===n?'style="border-color:var(--acc)"':''}>${n} days</button>`).join('')}</div></div><p class="mute">Green band: published reference range. Blue band: your usual range from earlier check-ins (context only, never changes a status). Hover or tap a dot for its date and value.</p></section>
 <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${ORD.map(k=>`<div class="tile"><h3>${S[k][0]}</h3>${spark(S[k][1],S[k][2],{big:1,n:range})}<p class="mute">${baseNote(S[k][1][0])}</p></div>`).join('')}</div>`;
}
function reportText(a){
 const t=a.today,L=['ASTROPULSE HEALTH REPORT','Decision support, not a diagnosis. Reference ranges are Earth-based.','Mission setting: '+$('mission').selectedOptions[0].text,'Check-in: '+t.date+'  (check-ins on file: '+hist.length+')','Overall status: '+LAB[t.overall],''];
 L.push('Flags raised:');if(a.flags.length)a.flags.forEach(f=>L.push(' - '+nice(f.reason)+' [rule '+f.rule+', '+(f.kind==='heuristic'?'app safety rule, not NASA':'published range')+']'));else L.push(' - none');
 L.push('','Indicators (latest, status, rule, last 7 check-ins):');
 ORD.forEach(k=>{const r=t.indicators[k];L.push(' - '+NAME[k]+': '+big(k,hist[hist.length-1]).join(' ')+(k==='symptoms'&&Array.isArray(hist[hist.length-1].symptoms)&&hist[hist.length-1].symptoms.length?' ('+hist[hist.length-1].symptoms.map(x=>E.SYMS[x]).join('; ')+')':'')+' | '+LAB[r.status]+' | '+r.rule+' | '+hist.slice(-7).map(e=>short(k,e)).join(', '))});
 L.push('','Not recorded or not scored indicators are never treated as normal.');return L.join('\n');
}
function qsend(){const a=E.analyze(hist,{});queue.push({time:new Date().toLocaleString(),status:link==='lost'?'queued':'sent',link,delay,level:level(a),text:reportText(a)});store()}
function vLink(a){
 const st={connected:'Link to Earth is open (simulated). Reports are delivered right away.',delayed:`Link to Earth is delayed by ${delay} min one way (NASA: up to 20 min on Mars missions). A reply can take ${2*delay} min or more.`,lost:'Link to Earth is lost (simulated). Reports are queued and sent when the link returns. Follow the steps below meanwhile.'}[link];
 const dg=`<svg class="chart" style="max-width:640px;margin:10px 0" viewBox="0 0 560 130" role="img" aria-label="Link between the crew and Earth: ${link}"><circle class="earth" cx="60" cy="58" r="36"/><text class="lt" x="60" y="115" text-anchor="middle">Earth</text><rect class="sc" x="486" y="44" width="40" height="28" rx="8"/><rect class="sc" x="470" y="52" width="12" height="12"/><rect class="sc" x="530" y="52" width="12" height="12"/><text class="lt" x="506" y="115" text-anchor="middle">Crew</text>${link==='lost'?'<path class="lk" d="M100 58L270 58M330 58L466 58" stroke-dasharray="4 8"/><path class="lkx" d="M288 42L312 74M312 42L288 74"/><text class="lt" x="300" y="100" text-anchor="middle">No signal. Reports are queued.</text>':`<path class="lk flow" d="M100 58L466 58"/><circle class="pk" r="5"><animateMotion dur="${link==='delayed'?7:1.6}s" repeatCount="indefinite" path="M100 58L466 58"/></circle><text class="lt" x="283" y="100" text-anchor="middle">${link==='delayed'?'Delayed: up to '+delay+' min one way (NASA)':'Open link (simulated)'}</text>`}</svg>`;
 let h=`<section class="panel"><h2>Mission Link</h2><p>Help for deciding what to do about your health when Earth cannot answer right away.</p>${dg}<div class="row"><div><label for="linksel" style="margin-top:0">Simulated link to Earth</label><select id="linksel"><option value="connected" ${link==='connected'?'selected':''}>Connected</option><option value="delayed" ${link==='delayed'?'selected':''}>Delayed</option><option value="lost" ${link==='lost'?'selected':''}>Lost</option></select></div>${link==='delayed'?`<div><label for="dly" style="margin-top:0">One-way delay, minutes (NASA: up to 20)</label><input type="number" id="dly" min="1" value="${delay}"></div>`:''}</div><p class="mute">${st} You can change the delay value.</p></section>`;
 if(!a)return h+'<section class="panel"><p>Complete a check-in to get a triage, a plan and a flight surgeon report.</p><button class="btn go" data-act="go" data-v="checkin">Start check-in</button></section>';
 const lv=level(a),T={urgent:['Urgent: contact the flight surgeon now','alert'],contact:['Contact the flight surgeon','alert'],watch:['Monitor and follow the plan','alert watch'],stable:['Stable: no action needed','alert ok']}[lv],plan=planItems(a);
 h+=`<section class="panel"><div class="${T[1]}"><h3>${T[0]}</h3>${a.flags.map(f=>`<p>${nice(f.reason)} <span class="mute">Rule ${f.rule}, ${f.kind==='heuristic'?'app safety rule (our own, not NASA)':'published range'}.</span></p>`).join('')}<p>${MIS[$('mission').value]}</p></div>
 <div class="two"><div><h3>While you wait</h3>${plan.length?`<ul class="l">${plan.map(p=>`<li>${p}</li>`).join('')}</ul>`:'<p class="mute">Keep your normal routine.</p>'}<p class="mute">Actions NASA research lists plus re-measure steps.</p></div>
 <div><h3>Escalate now if</h3><ul class="l"><li>A reading enters an urgent range (blood pressure above 180 or 120).</li><li>Any reading turns red.</li><li>You feel unwell or develop symptoms.</li></ul><p class="mute">Use your mission’s emergency procedure and do not wait for a reply.</p></div></div></section>
 <section class="panel"><h2>Report for the flight surgeon</h2><div class="rep" id="rep">${esc(reportText(a))}</div><div class="row" style="margin-top:10px"><button class="btn" data-act="copy">Copy report</button><button class="btn go" data-act="qsend">${link==='lost'?'Queue for Earth':'Send to Earth (simulated)'}</button></div></section>
 <section class="panel"><h2>Earth outbox</h2>${queue.length?queue.slice().reverse().map(q=>`<p><b>${q.status==='sent'?'Sent':'Queued'}</b> ${esc(q.time)} <span class="mute">${q.status==='queued'?'Will send when the link returns.':q.link==='delayed'?'Reply not expected for about '+(2*q.delay)+' min (simulated).':'Delivered (simulated).'}</span></p>`).join(''):'<p class="mute">Nothing sent yet.</p>'}</section>`;
 return h;
}
function vAbout(){return `<section class="panel"><h2>Method and sources</h2>
<p>AstroPulse compares each reading with published Earth-based reference ranges and with your own earlier readings. Every alert shows its rule and its source.</p>
<h3>Reference ranges used</h3><ul class="l"><li>Blood pressure: NHLBI and American Heart Association</li><li>Resting heart rate 60 to 100: MedlinePlus and Cleveland Clinic</li><li>Fasting blood sugar: American Diabetes Association</li><li>Temperature: MedlinePlus (NIH/NLM)</li><li>Sleep of 7 hours or more: CDC</li><li>Mood screen: PHQ-2, cut-off 3</li></ul>
<h3>Values taken from NASA Human Research Program pages</h3><ul class="l"><li>Communication delay of up to 20 minutes one way on Mars missions. Mars is about 140 million miles away.</li><li>ISS exercise routine: 1.5 hours a day, 6 to 7 days a week</li><li>Average strength and aerobic fitness loss of 10 to 12%, and bone density loss of 1 to 1.5% a month on 4 to 6 month missions</li><li>16 sunrises and sunsets a day on the station</li><li>Symptoms and countermeasures listed on the NASA risk pages</li></ul>
<h3>Limits</h3><p>Simulated demo data only. This is decision support, not a diagnosis. It is an independent participant project and is not endorsed by NASA.</p></section>`}
function render(){
 const a=hist.length?E.analyze(hist,{}):null;
 document.body.dataset.level=a?level(a):'none';
 $('nav').innerHTML=VIEWS.map(v=>`<button data-act="go" data-v="${v[0]}" ${v[0]===view?'aria-current="page"':''}>${v[1]}</button>`).join('');
 $('day').textContent=hist.length?'Mission day '+hist.length:'No check-ins yet';
 $('pill').textContent='Earth link: '+({connected:'connected',delayed:'delayed (up to '+delay+' min one way)',lost:'lost'}[link]);
 $('pill').className='chip '+(link==='connected'?'s-GREEN':link==='delayed'?'s-YELLOW':'s-RED');
 const V={today:vToday,checkin:vCheck,body:vBody,trends:vTrends,link:vLink,about:vAbout}[view];
 $('main').innerHTML=(sample?'<p class="call">You are viewing simulated demo data. Clear it before entering real readings.</p>':'')+(toast?`<p class="call" role="status">${esc(toast)}</p>`:'')+V(a)+`<section class="panel"><div class="row"><label for="demo" style="margin:0">Demo data (simulated)</label><select id="demo"><option value="">Choose a scenario</option>${SC.map((s,i)=>`<option value="${i}">${s[0]}</option>`).join('')}</select><button class="btn warn" data-act="clear">Clear all data</button></div><p class="mute">AstroPulse supports decisions and does not diagnose. Ranges are Earth-based medical references; NASA publishes no public astronaut warning limits. The mission setting changes wording only, never the numbers.</p></section>`;
 toast='';
}
function go(v){view=v;if(location.hash.slice(1)===v)render();else location.hash=v}
function finish(){
 const e=dEntry(),ev=E.evaluate(e),bad=ORD.filter(k=>ev.indicators[k].status==='CHECK');
 if(bad.length){toast='Not saved. '+ev.indicators[bad[0]].message;step=ST.findIndex(s=>s.k===bad[0]);return render()}
 if(!['bpSys','bpDia','hr','glucose','temp','sleep','phq2','moodTracker','exercise','symptoms'].some(k=>nb(e[k]))){toast='Not saved. Enter at least one measurement.';return render()}
 if(sample){hist=[];sample=false}
 if(hist.length&&hist[hist.length-1].date===e.date)hist[hist.length-1]=e;else hist.push(e);
 store();draft={fasting:true,tempUnit:'C'};step=0;toast='Check-in saved.';go('today');
}
function demo(i){sample=true;hist=SC[i][1].map((r,k)=>({date:'Day '+(k+1),bpSys:r[0],bpDia:r[1],hr:r[2],glucose:r[3],fasting:true,temp:r[4],tempUnit:'C',sleep:r[5],phq2:r[6],moodTracker:null,exercise:[95,95,95,95,95,0,95][k],symptoms:(i===1&&k>=5)?['head','faint']:[]}));render()}
document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-act],[data-r]');if(!t)return;
 if(t.dataset.r){sel=t.dataset.r;return render()}
 const a=t.dataset.act;
 if(a==='go')go(t.dataset.v);
 else if(a==='next'){step++;render()}
 else if(a==='back'){step--;render()}
 else if(a==='skip'){const s=ST[step];s.f.forEach(x=>delete draft[x[0]]);if(s.k==='mood'){delete draft.mood;delete draft.q1;delete draft.q2}if(s.k==='symptoms')delete draft.sym;if(step<ST.length-1){step++;render()}else finish()}
 else if(a==='finish')finish();
 else if(a==='range'){range=+t.dataset.n;render()}
 else if(a==='clear'){hist=[];queue=[];sample=false;store();toast='All data cleared.';render()}
 else if(a==='qsend'){qsend();toast=link==='lost'?'Report queued. It sends when the link returns.':'Report sent (simulated).';render()}
 else if(a==='copy'){const el=$('rep');try{navigator.clipboard.writeText(el.textContent).then(()=>{toast='Report copied.';render()},()=>{})}catch(x){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast='Report selected. Press copy on your device.';}}
});
document.addEventListener('keydown',ev=>{const t=ev.target;
 if(ev.key==='Enter'&&t.dataset&&t.dataset.f&&t.type==='number'){const b=document.querySelector('[data-act="next"],[data-act="finish"]');if(b)b.click();return}if((ev.key==='Enter'||ev.key===' ')&&t.dataset&&t.dataset.r&&t.tagName!=='BUTTON'){ev.preventDefault();sel=t.dataset.r;render()}});
document.addEventListener('input',ev=>{const t=ev.target;if(!t.dataset||!t.dataset.f||t.tagName==='SELECT')return;
 draft[t.dataset.f]=t.type==='checkbox'?t.checked:(t.value===''?null:parseFloat(t.value));const fb=$('fb');if(fb)fb.innerHTML=fbHTML()});
document.addEventListener('change',ev=>{const t=ev.target;
 if(t.dataset&&t.dataset.sym){const k=t.dataset.sym;let sy=Array.isArray(draft.sym)?draft.sym.filter(x=>x!==k):[];if(k==='none'){if(t.checked)draft.sym=[];else delete draft.sym}else{if(t.checked)sy.push(k);if(sy.length)draft.sym=sy;else delete draft.sym}render();return}
 if(t.dataset&&t.dataset.f&&t.tagName==='SELECT'){draft[t.dataset.f]=t.value===''?null:(t.dataset.n?parseInt(t.value,10):t.value);const fb=$('fb');if(fb)fb.innerHTML=fbHTML();return}
 if(t.id==='mission'){if(t.value==='base'){link='delayed';delay=20}else if(t.value==='station')link='connected';return render()}
 if(t.id==='demo'&&t.value!=='')return demo(+t.value);
 if(t.id==='linksel'){const was=link;link=t.value;if(was==='lost'&&link!=='lost')queue.forEach(q=>{if(q.status==='queued'){q.status='sent';q.link=link;q.delay=delay}});store();return render()}
 if(t.id==='dly'){delay=Math.max(1,parseInt(t.value,10)||1);return render()}
 if(t.dataset&&t.dataset.done!==undefined){const a=hist.length?E.analyze(hist,{}):null;if(!a)return;const p=fullPlan(a);done[p[+t.dataset.done]]=t.checked}
});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.some(x=>x[0]===v)){view=v;render()}});
function tick(){const d=new Date(),p=n=>String(n).padStart(2,'0'),el=$('utc');if(el)el.textContent='UTC '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds());}
load();{const v=location.hash.slice(1);if(VIEWS.some(x=>x[0]===v))view=v}
tick();setInterval(tick,1000);
render();
})();
</script>
</body>
</html>
